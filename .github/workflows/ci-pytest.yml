name: 'CI - Swift functional tests'

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  pytest:
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
      CLOWDER_DEBUG: true
      CLOWDER_IMPLEMENTATION: swift
      PYTHONPATH: ${{ github.workspace }}
    # Keep the existing required-check names while selecting compatible runners.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-latest,
          ubuntu-latest,
          # TODO: windows-latest
        ]
        python-version: [
          '3.8',
          # '3.9',
          # '3.10',
          '3.11'
        ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
        persist-credentials: false
    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Import Swift release signing keys
      if: runner.os == 'Linux'
      run: |
        curl --proto '=https' --tlsv1.2 -fsS https://www.swift.org/keys/all-keys.asc -o "$RUNNER_TEMP/swift-release-keys.asc"
        gpg --batch --import "$RUNNER_TEMP/swift-release-keys.asc"
    - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3 (Swiftly installer)
      with:
        swift-version: '6.4.1'
    - name: Build Swift CLI
      run: |
        swift build --package-path swift -c release
        swift_bin=$(swift build --package-path swift -c release --show-bin-path)
        echo "CLOWDER_EXECUTABLE=$swift_bin/clowder" >> "$GITHUB_ENV"
        echo "$swift_bin" >> "$GITHUB_PATH"
    - name: Setup git config
      run: |
        git config --global user.email "joe@polka.cat"
        git config --global user.name "GitHub Actions Workflow"
    - name: Install the Python test harness
      id: install
      run: |
        python -m pip install --upgrade 'pip<25' setuptools==67.8.0 wheel==0.40.0
        python -m pip install -r requirements.txt
        python -m pip install --no-deps --no-build-isolation -e .
        python -m clowder.app --help
        mkdir -p temp build/coverage build/junit build/cucumber
    - name: Build documentation
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: python -m sphinx -b html docs build/docs/html
    - name: Run initialization tests against published URLs
      run: |
        python -m pytest tests/functional -v -n 4 --exitfirst \
          --basetemp=temp/init -m 'init and not ssh and not offline and not write' \
          --cov=clowder --cov-append --cov-config=.coveragerc \
          --cov-report=xml:build/coverage/init.xml \
          --junitxml=build/junit/init.xml --cucumberjson=build/cucumber/init.json
    - name: Run functional tests against published manifests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        python -m pytest tests/functional -v -n 4 --exitfirst \
          --basetemp=temp/functional -m 'not init and not ssh and not offline and not write and not lfs' \
          --cov=clowder --cov-append --cov-config=.coveragerc \
          --cov-report=xml:build/coverage/functional.xml \
          --junitxml=build/junit/functional.xml --cucumberjson=build/cucumber/functional.json
    - name: Run LFS tests serially on the disposable runner
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        for filter in clean smudge process required; do
          sudo git config --system --unset-all "filter.lfs.$filter" || true
        done
        python -m pytest tests/functional -v --exitfirst \
          --basetemp=temp/lfs -m 'lfs and not ssh and not offline and not write' \
          --cov=clowder --cov-append --cov-config=.coveragerc \
          --cov-report=xml:build/coverage/lfs.xml \
          --junitxml=build/junit/lfs.xml --cucumberjson=build/cucumber/lfs.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage-ghworkflow-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          build/cucumber
          build/junit
          build/coverage
