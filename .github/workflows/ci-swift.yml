name: CI - Swift

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Swift release signing keys
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://www.swift.org/keys/all-keys.asc -o "$RUNNER_TEMP/swift-release-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-release-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3 (Swiftly installer)
        with:
          swift-version: '6.4.1'
      - name: Check shared resources and formatting
        run: |
          swift --version
          python3 script/check-swift
      - name: Native Swift tests
        run: swift test --package-path swift
      - name: Install the pinned Rust compatibility-test toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Existing native compatibility tests against Swift
        run: python3 script/test-native-compatibility swift/.build/debug/clowder
      - name: Release build
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            swift build --package-path swift -c release --static-swift-stdlib
          else
            swift build --package-path swift -c release
          fi
          swift/.build/release/clowder --version
