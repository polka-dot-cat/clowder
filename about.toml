# Used by script/update-rust-licenses with the locked dependency graph.
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "MIT-0"]
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl",
]
private = { ignore = true }

# These workspace crates omit their repository's license from the crate archive.
# Pin the text hash; cargo-about reads each crate's recorded source commit.
[jsonschema-regex.clarify]
license = "MIT"
[[jsonschema-regex.clarify.git]]
path = "LICENSE"
checksum = "117829c3ca21efb132d81a44b55363d395ab8eea18526873bc828da4c0e5f038"

[jsonschema-value.clarify]
license = "MIT"
[[jsonschema-value.clarify.git]]
path = "LICENSE"
checksum = "117829c3ca21efb132d81a44b55363d395ab8eea18526873bc828da4c0e5f038"

[uuid-simd.clarify]
license = "MIT"
[[uuid-simd.clarify.git]]
path = "LICENSE"
checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d"

[vsimd.clarify]
license = "MIT"
[[vsimd.clarify.git]]
path = "LICENSE"
checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d"

# Preserve the author notice in this file's combined license text.
[num-cmp.clarify]
license = "MIT OR Apache-2.0"
[[num-cmp.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
