version: 2.1

commands:
  setup_rust:
    steps:
      - run:
          name: Install the pinned Rust toolchain
          command: |
            curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/clowder-rustup-init.sh
            sh /tmp/clowder-rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.99.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup component add clippy rustfmt
      - restore_cache:
          keys:
            - rust-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: Build the native CLI
          command: |
            cargo build --locked
            echo "export CLOWDER_EXECUTABLE='$PWD/target/debug/clowder'" >> "$BASH_ENV"
            echo "export PYTHONPATH='$PWD'" >> "$BASH_ENV"
      - save_cache:
          key: rust-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
  install_code_climate:
    steps:
      - run:
          name: Install Code Climate test coverage reporter
          command: script/install_cc_test_reporter
  setup_ssh:
    steps:
      - add_ssh_keys:
          fingerprints:
            - "e9:7d:20:a0:51:b2:9c:22:f6:b9:5b:55:47:c4:7c:20"
      - run:
          name: Add ssh key to known_hosts
          command: ssh-keyscan -H polka-dot-cat.git.beanstalkapp.com >> ~/.ssh/known_hosts

  setup_git_config:
    steps:
      - run:
          name: Setup git config
          command: |
            git config --global user.email "joe@polka.cat"
            git config --global user.name "CircleCI"
            git config --global push.default simple
            git config --global --unset url.ssh://git@github.com.insteadOf

  install_git_lfs:
    steps:
      - run:
          name: Install git lfs
          command: sudo apt-get install git-lfs

  report_coverage:
    steps:
      - attach_workspace:
          at: build
      - run:
          name: Install coverage.py
          command: pip install coverage
      - run:
          name: Generate test coverage reports
          command: script/test --report-coverage
      - run:
          name: Sum coverage for Code climate
          command: |
            ./cc-test-reporter sum-coverage \
              --parts 4 \
              --output build/codeclimate/codeclimate.json \
              build/codeclimate/codeclimate.*.json
      - run:
          name: Upload coverage to Code climate
          command: |
            ./cc-test-reporter upload-coverage \
              --id ${CC_TEST_REPORTER_ID} \
              --input build/codeclimate/codeclimate.json
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build

  test_with_docker:
    description: "Pytest functional tests in docker image"
    parameters:
      markers:
        type: string
      label:
        type: string
      parallel:
        type: boolean
        default: false
      groups:
        type: integer
        default: 0
      group:
        type: integer
        default: 0
    steps:
      - run:
          name: Initialize Code Climate test coverage reporter
          command: ./cc-test-reporter before-build
      - run:
          name: Start clowder tests docker container
          command: script/docker start
      - when:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                docker-compose exec clowder script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --parallel \
                  --exitfirst
      - unless:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                docker-compose exec clowder script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --verbose \
                  --exitfirst
      - run:
          name: Update build files ownership
          command: sudo chown -R ${USER} .
      - when:
          condition: <<parameters.group>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.<<parameters.group>>.json \
                    build/coverage/coverage.<<parameters.label>>.<<parameters.group>>.xml
      - unless:
          condition: <<parameters.group>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.json \
                    build/coverage/coverage.<<parameters.label>>.xml
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build
      - persist_to_workspace:
          root: build
          paths:
            - codeclimate
            - coverage
            - cucumber
            - junit

  test:
    description: "Pytest functional tests"
    parameters:
      markers:
        type: string
      label:
        type: string
      parallel:
        type: boolean
        default: false
      groups:
        type: integer
        default: 0
      group:
        type: integer
        default: 0
    steps:
      - run:
          name: Initialize Code Climate test coverage reporter
          command: ./cc-test-reporter before-build
      - when:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --parallel \
                  --exitfirst
      - unless:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --verbose \
                  --exitfirst
      - when:
          condition: <<parameters.groups>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.<<parameters.group>>.json \
                    build/coverage/coverage.<<parameters.label>>.<<parameters.group>>.xml
      - unless:
          condition: <<parameters.groups>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.json \
                    build/coverage/coverage.<<parameters.label>>.xml
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build
      - persist_to_workspace:
          root: build
          paths:
            - codeclimate
            - coverage
            - cucumber
            - junit

jobs:
  test_parallel:
    docker:
      - image: cimg/python:3.8
    parameters:
      groups:
        type: integer
      group:
        type: integer
    steps:
      - checkout
      - setup_ssh
      - install_git_lfs
      - setup_git_config
      - run: script/cibuild
      - install_code_climate
      - test:
          markers: not write and not offline
          label: parallel
          parallel: true
          groups: <<parameters.groups>>
          group: <<parameters.group>>
  test_write:
    docker:
      - image: cimg/python:3.8.16
    steps:
      - checkout
      - setup_ssh
      - install_git_lfs
      - setup_git_config
      - run: script/cibuild
      - setup_rust
      - run:
          name: Run native write tests against published manifests
          command: |
            write_key="$HOME/.ssh/id_rsa_e97d20a051b29c22f6b95b5547c47c20"
            if [[ ! -f "$write_key" ]]; then
              echo 'Missing CircleCI additional SSH key e9:7d:20:a0:51:b2:9c:22:f6:b9:5b:55:47:c4:7c:20' >&2
              exit 1
            fi
            export GIT_SSH_COMMAND="ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i \"$write_key\""
            mkdir -p build/coverage build/junit build/cucumber
            # Save only the public key so account access can be restored if needed.
            ssh-keygen -y -P '' -f "$write_key" > build/circleci-write-key.pub
            for project in mu duke kishka kit sasha june; do
              # Hooks (including LFS uploads) can run even for a dry-run push.
              git push --dry-run --no-verify \
                "git@github.com:polka-dot-cat/$project.git" \
                HEAD:refs/heads/pytest-ci-access-check
            done
            python -m pytest tests/functional -v -s --tb=short --exitfirst \
              --basetemp=temp -m 'write and not offline' \
              --cov=clowder --cov-append --cov-config=.coveragerc \
              --cov-report=xml:build/coverage/coverage.write.xml \
              --cov-report=html:build/coverage/html.write \
              --cov-report=annotate:build/coverage/annotate.write \
              --junitxml=build/junit/results.write.xml \
              --cucumberjson=build/cucumber/results.write.json
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build
  rust:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - setup_git_config
      - setup_rust
      - run:
          name: Check Rust formatting, lints, and local regressions
          command: |
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            cargo test --locked
      - run:
          name: Install the unchanged BDD harness
          command: |
            python -m pip install --upgrade 'pip<25' setuptools==67.8.0 wheel==0.40.0
            python -m pip install -r requirements.txt
      - run:
          name: Run read-only BDD scenarios against the native CLI
          no_output_timeout: 15m
          command: |
            mkdir -p build/junit build/cucumber
            python -m pytest tests/functional -v -n 4 --tb=short \
              --basetemp=temp/rust -m 'not ssh and not offline and not write and not lfs' \
              --junitxml=build/junit/rust.xml --cucumberjson=build/cucumber/rust.json
      - store_test_results:
          path: build/junit
      - store_artifacts:
          path: build
  test_offline:
    machine: true
    steps:
      - checkout
      - setup_ssh
      - setup_git_config
      - run: pyenv install
      - install_code_climate
      - test_with_docker:
          markers: offline
          label: offline
  report_coverage:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - setup_git_config
      - run: script/cibuild
      - install_code_climate
      - report_coverage
  # deploy:
  #   macos:
  #     xcode: "12.0.0"
  #   steps:
  #     - checkout
  #     - setup_git_config
  #     - run:
  #         name: Install clowder and dependencies
  #         command: script/update
  #     - run:
  #         name: Deploy
  #         command: script/deploy

workflows:
  pytest:
    jobs:
      - rust
      - test_write:
          # These cases share remote pytest branches in the example repositories.
          serial-group: << pipeline.project.slug >>/test-write
