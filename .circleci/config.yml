version: 2.1

commands:
  setup_rust:
    steps:
      - run:
          name: Install the pinned Rust toolchain
          command: |
            curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/clowder-rustup-init.sh
            sh /tmp/clowder-rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.99.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup component add clippy rustfmt
      - restore_cache:
          keys:
            - rust-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: Build the Rust comparison CLI
          command: |
            cargo build --locked
            echo 'export CLOWDER_IMPLEMENTATION=rust' >> "$BASH_ENV"
            echo "export CLOWDER_EXECUTABLE='$PWD/target/debug/clowder'" >> "$BASH_ENV"
            echo "export PATH='$PWD/target/debug':\"\$PATH\"" >> "$BASH_ENV"
            echo "export PYTHONPATH='$PWD'" >> "$BASH_ENV"
      - save_cache:
          key: rust-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
  install_code_climate:
    steps:
      - run:
          name: Install Code Climate test coverage reporter
          command: script/install_cc_test_reporter
  setup_ssh:
    steps:
      - add_ssh_keys:
          fingerprints:
            - "e9:7d:20:a0:51:b2:9c:22:f6:b9:5b:55:47:c4:7c:20"
      - run:
          name: Add ssh key to known_hosts
          command: ssh-keyscan -H polka-dot-cat.git.beanstalkapp.com >> ~/.ssh/known_hosts

  setup_git_config:
    steps:
      - run:
          name: Setup git config
          command: |
            git config --global user.email "joe@polka.cat"
            git config --global user.name "CircleCI"
            git config --global push.default simple
            git config --global --unset url.ssh://git@github.com.insteadOf

  install_git_lfs:
    steps:
      - run:
          name: Install git lfs
          command: sudo apt-get install git-lfs

  report_coverage:
    steps:
      - attach_workspace:
          at: build
      - run:
          name: Install coverage.py
          command: pip install coverage
      - run:
          name: Generate test coverage reports
          command: script/test --report-coverage
      - run:
          name: Sum coverage for Code climate
          command: |
            ./cc-test-reporter sum-coverage \
              --parts 4 \
              --output build/codeclimate/codeclimate.json \
              build/codeclimate/codeclimate.*.json
      - run:
          name: Upload coverage to Code climate
          command: |
            ./cc-test-reporter upload-coverage \
              --id ${CC_TEST_REPORTER_ID} \
              --input build/codeclimate/codeclimate.json
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build

  test_with_docker:
    description: "Pytest functional tests in docker image"
    parameters:
      markers:
        type: string
      label:
        type: string
      parallel:
        type: boolean
        default: false
      groups:
        type: integer
        default: 0
      group:
        type: integer
        default: 0
    steps:
      - run:
          name: Initialize Code Climate test coverage reporter
          command: ./cc-test-reporter before-build
      - run:
          name: Start clowder tests docker container
          command: script/docker start
      - when:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                docker-compose exec clowder script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --parallel \
                  --exitfirst
      - unless:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                docker-compose exec clowder script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --verbose \
                  --exitfirst
      - run:
          name: Update build files ownership
          command: sudo chown -R ${USER} .
      - when:
          condition: <<parameters.group>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.<<parameters.group>>.json \
                    build/coverage/coverage.<<parameters.label>>.<<parameters.group>>.xml
      - unless:
          condition: <<parameters.group>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.json \
                    build/coverage/coverage.<<parameters.label>>.xml
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build
      - persist_to_workspace:
          root: build
          paths:
            - codeclimate
            - coverage
            - cucumber
            - junit

  test:
    description: "Pytest functional tests"
    parameters:
      markers:
        type: string
      label:
        type: string
      parallel:
        type: boolean
        default: false
      groups:
        type: integer
        default: 0
      group:
        type: integer
        default: 0
    steps:
      - run:
          name: Initialize Code Climate test coverage reporter
          command: ./cc-test-reporter before-build
      - when:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --parallel \
                  --exitfirst
      - unless:
          condition: <<parameters.parallel>>
          steps:
            - run: |
                script/test \
                  --markers "<<parameters.markers>>" \
                  --label <<parameters.label>> \
                  --groups <<parameters.groups>> \
                  --group <<parameters.group>> \
                  --verbose \
                  --exitfirst
      - when:
          condition: <<parameters.groups>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.<<parameters.group>>.json \
                    build/coverage/coverage.<<parameters.label>>.<<parameters.group>>.xml
      - unless:
          condition: <<parameters.groups>>
          steps:
            - run:
                name: Format coverage for Code climate
                command: |
                  ./cc-test-reporter format-coverage \
                    --input-type coverage.py \
                    --output build/codeclimate/codeclimate.<<parameters.label>>.json \
                    build/coverage/coverage.<<parameters.label>>.xml
      - store_test_results:
          path: build/junit/
      - store_artifacts:
          path: build
      - persist_to_workspace:
          root: build
          paths:
            - codeclimate
            - coverage
            - cucumber
            - junit

jobs:
  test_parallel:
    docker:
      - image: cimg/python:3.8
    parameters:
      groups:
        type: integer
      group:
        type: integer
    steps:
      - checkout
      - setup_ssh
      - install_git_lfs
      - setup_git_config
      - run: script/cibuild
      - install_code_climate
      - test:
          markers: not write and not offline
          label: parallel
          parallel: true
          groups: <<parameters.groups>>
          group: <<parameters.group>>
  test_write:
    # Preserve the required check name; all 89 writes now use Swift and private fixtures.
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build the isolated Swift test environment
          no_output_timeout: 20m
          command: python3 script/test-isolated build --implementation swift
      - run:
          name: Run Swift write tests without public repository credentials
          no_output_timeout: 15m
          command: python3 script/test-isolated write --implementation swift
      - store_test_results:
          path: build/isolated/swift
      - store_artifacts:
          path: build/isolated/swift
  rust:
    docker:
      - image: cimg/python:3.11.9
    environment:
      PYENV_VERSION: "3.11.9"
      CLOWDER_IMPLEMENTATION: rust
    steps:
      - checkout
      - setup_git_config
      - setup_rust
      - run:
          name: Check Rust formatting, lints, and local regressions
          command: |
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            env -u BASH_ENV cargo test --locked
            python -m unittest discover -s tests/isolation -p 'test_*.py'
      - run:
          name: Build the native Linux archive
          command: |
            script/package-rust
            cargo package --locked
            cp target/package/*.crate dist/rust/
      - run:
          name: Install the unchanged BDD harness
          command: |
            python -m pip install --upgrade 'pip<25' setuptools==67.8.0 wheel==0.40.0
            python -m pip install -r requirements.txt
      - run:
          name: Measure native coverage with local and read-only BDD scenarios
          no_output_timeout: 15m
          command: |
            rustup component add llvm-tools-preview
            cargo install cargo-llvm-cov --version 0.9.1 --locked
            mkdir -p temp build/junit build/cucumber
            script/coverage-rust -- python -m pytest tests/functional -v -n 4 --tb=short \
              --basetemp=temp/rust -m 'not ssh and not offline and not write and not lfs' \
              --junitxml=build/junit/rust.xml --cucumberjson=build/cucumber/rust.json
      - store_test_results:
          path: build/junit
      - store_artifacts:
          path: build
      - store_artifacts:
          path: dist/rust
  rust_macos:
    environment:
      CLOWDER_IMPLEMENTATION: rust
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - setup_rust
      - run:
          name: Check native macOS regressions and packaging
          command: |
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            env -u BASH_ENV cargo test --locked
            script/package-rust
            archive=$(find dist/rust -name '*.tar.gz' -print -quit)
            (cd dist/rust && shasum -a 256 -c "$(basename "$archive").sha256")
            staging=$(mktemp -d)
            trap 'rm -rf "$staging"' EXIT
            tar -xzf "$archive" -C "$staging"
            "$staging"/*/clowder --version
      - store_artifacts:
          path: dist/rust
  test_offline:
    machine: true
    steps:
      - checkout
      - setup_ssh
      - setup_git_config
      - run: pyenv install
      - install_code_climate
      - test_with_docker:
          markers: offline
          label: offline
  report_coverage:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - setup_git_config
      - run: script/cibuild
      - install_code_climate
      - report_coverage
  # deploy:
  #   macos:
  #     xcode: "12.0.0"
  #   steps:
  #     - checkout
  #     - setup_git_config
  #     - run:
  #         name: Install clowder and dependencies
  #         command: script/update
  #     - run:
  #         name: Deploy
  #         command: script/deploy

workflows:
  pytest:
    jobs:
      - rust
      - rust_macos
      - test_write:
          # Keep the existing workflow queue; writes use private container repositories.
          serial-group: << pipeline.project.slug >>/test-write
